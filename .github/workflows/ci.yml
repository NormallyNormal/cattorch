name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported dependency boundary.
          - python-version: "3.10"
            torch-version: "2.6.*"
            label: minimum
          # Current Python versions against the current CPU wheel.
          - python-version: "3.11"
            torch-version: ""
            label: current
          - python-version: "3.12"
            torch-version: ""
            label: current
          - python-version: "3.13"
            torch-version: ""
            label: current

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          TORCH_VERSION: ${{ matrix.torch-version }}
        run: |
          pip install --upgrade pip
          pip install "torch${TORCH_VERSION:+==$TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Validate Markdown documentation
        run: pytest tests/test_docs.py -q

      - name: Run tests
        run: pytest tests/ -v -n auto --ignore=tests/test_docs.py

      # Every recorded OpInfo case; the test suite checks one per operator.
      # Skips itself when the PyTorch version differs from the recorded one.
      - name: Check OpInfo conformance
        if: matrix.label == 'current' && matrix.python-version == '3.13'
        run: python tests/opinfo_conformance.py --check

      - name: Check Python sources
        run: |
          python -m compileall -q cattorch tests benchmarks
          ruff check cattorch tests benchmarks

      - name: Check typed public modules
        run: mypy --follow-imports=skip --ignore-missing-imports cattorch/results.py cattorch/errors.py cattorch/codegen.py cattorch/storage.py cattorch/quantization.py cattorch/fast.py cattorch/tokenizer.py cattorch/verify.py cattorch/frontend.py cattorch/operator_registry.py cattorch/kernel_api.py cattorch/custom_ops.py cattorch/scratch.py cattorch/kernel_testing.py cattorch/markers.py cattorch/dynamic.py cattorch/util/instruction/row_loop.py cattorch/project.py cattorch/cli.py cattorch/interface.py

  # Exported sprites in the official Scratch VM, compared with PyTorch.
  scratch-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: benchmarks/package-lock.json

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          npm ci --prefix benchmarks

      - name: Run sprites in scratch-vm
        env:
          CATTORCH_REQUIRE_VM: "1"
        run: pytest tests/test_real_vm.py -v -n auto

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
