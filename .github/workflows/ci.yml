name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported dependency boundary.
          - python-version: "3.10"
            torch-version: "2.6.*"
            label: minimum
          # Current Python versions against the current CPU wheel.
          - python-version: "3.11"
            torch-version: ""
            label: current
          - python-version: "3.12"
            torch-version: ""
            label: current
          - python-version: "3.13"
            torch-version: ""
            label: current

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          TORCH_VERSION: ${{ matrix.torch-version }}
        run: |
          pip install --upgrade pip
          pip install "torch${TORCH_VERSION:+==$TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Validate Markdown documentation
        run: pytest tests/test_docs.py -q

      - name: Run tests
        run: pytest tests/ -v --ignore=tests/test_docs.py

      - name: Check Python sources
        run: |
          python -m compileall -q cattorch tests benchmarks
          ruff check cattorch tests benchmarks

      - name: Check typed public modules
        run: mypy --follow-imports=skip --ignore-missing-imports cattorch/results.py cattorch/errors.py cattorch/codegen.py cattorch/storage.py cattorch/quantization.py cattorch/fast.py cattorch/tokenizer.py cattorch/verify.py cattorch/frontend.py cattorch/operator_registry.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
