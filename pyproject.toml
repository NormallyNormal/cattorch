[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cattorch"
version = "0.5.0"
description = "Export PyTorch modules to Scratch sprites"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["pytorch", "scratch", "neural-network", "transpiler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.10",
]

[project.optional-dependencies]
tokenizers = ["tokenizers", "transformers", "sentencepiece"]
dev = ["pytest", "pytest-xdist", "expecttest", "ruff", "mypy", "transformers", "tokenizers", "sentencepiece", "twine"]

[project.urls]
Repository = "https://github.com/NormallyNormal/cattorch"
Documentation = "https://github.com/NormallyNormal/cattorch/blob/main/docs/index.md"
Changelog = "https://github.com/NormallyNormal/cattorch/blob/main/CHANGELOG.md"

[project.scripts]
cattorch = "cattorch.cli:main"
cattorch-benchmark = "cattorch.benchmark:main"

[tool.setuptools.packages.find]
include = ["cattorch*"]

[tool.setuptools.package-data]
cattorch = ["templates/sprite/*.svg", "py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
markers = [
    "vm: runs exported sprites in the official Scratch VM (needs Node.js and npm ci in benchmarks/)",
]
filterwarnings = [
    "error:the model has modules in training mode:UserWarning",
    # Tests that compare the two frontends; test_frontend checks the warning.
    "ignore:frontend='export' is deprecated:DeprecationWarning",
]
